name: Regenerate Javadocs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  javadoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Generate Javadocs
        run: |
          mvn -DskipTests javadoc:javadoc -Dshow=public -Dsubpackages=com.github.miachm.sods

      - name: Update docs folder
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R target/site/apidocs/. docs/

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- docs; then
            echo "No Javadoc changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Regenerate Javadocs"
          git push
